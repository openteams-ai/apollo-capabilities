name: Validate Capabilities

on:
  pull_request:
    paths:
      - "capabilities/**/pixi.toml"
      - "capabilities/**/pixi.lock"
      - "spec/capability.schema.json"
      - ".github/workflows/validate.yml"
      - "scripts/generate_catalog.py"
      - "scripts/test_generate_catalog.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install jsonschema
        # pip verifies PyPI with its own vendored certifi; 26.2.2 is the first
        # release that distrusts the compromised eMudhra intermediates.
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install "jsonschema==4.*"

      - name: Validate capabilities
        run: |
          python - <<'EOF'
          import sys
          import tomllib
          import json
          import pathlib
          import jsonschema

          schema_path = pathlib.Path("spec/capability.schema.json")
          schema = json.loads(schema_path.read_text())

          manifests = sorted(pathlib.Path("capabilities").glob("*/pixi.toml"))
          if not manifests:
              print("No capabilities found to validate.")
              sys.exit(0)

          errors = []
          for manifest in manifests:
              print(f"Validating {manifest} ...", end=" ")
              data = tomllib.loads(manifest.read_text())
              try:
                  jsonschema.validate(instance=data, schema=schema)
                  print("OK")
              except jsonschema.ValidationError as e:
                  print("FAILED")
                  errors.append(f"{manifest}: {e.message} (path: {' -> '.join(str(p) for p in e.absolute_path)})")

          if errors:
              print("\nValidation errors:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print(f"\nAll {len(manifests)} capability manifest(s) are valid.")
          EOF

      - name: Test catalog generation
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate catalog
        run: python scripts/generate_catalog.py --output /tmp/catalog.json

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          run-install: false

      # Fails when a lockfile no longer matches its manifest, so a manifest
      # edit cannot land without a re-lock, and proves the pinned Pixi (the
      # version every capability's requires-pixi names) reads every lock.
      - name: Lockfiles match manifests
        run: |
          set -euo pipefail
          for manifest in capabilities/*/pixi.toml; do
            echo "==> ${manifest}"
            pixi lock --check --manifest-path "${manifest}"
          done
